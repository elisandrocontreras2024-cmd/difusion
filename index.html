<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAM WORLD | Canal de Difusión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        header { border-bottom: 2px solid #238636; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #58a6ff; font-size: 1.5rem; text-transform: uppercase; }
        .status { color: #3fb950; font-size: 0.85rem; margin-top: 5px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .card-title { color: #f0f6fc; font-size: 1.1rem; margin-bottom: 8px; }
        .card-date { color: #8b949e; font-size: 0.75rem; margin-bottom: 10px; }
        .card-body { font-size: 0.9rem; line-height: 1.4; color: #8b949e; }
        .badge { background: #21262d; border: 1px solid #30363d; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DREAM WORLD</h1>
            <div class="status">● SISTEMA DE DIFUSIÓN ACTIVO</div>
        </header>

        <main>
            <div class="card">
                <div class="card-title">COMUNICADO OFICIAL #001</div>
                <div class="card-date">PUBLICADO: 2026-08-24</div>
                <div class="card-body">
                    Bienvenido a la plataforma de difusiones. Este sitio opera de forma estática para maximizar velocidad y seguridad.
                </div>
                <br>
                <span class="badge">ESTADO: ONLINE</span>
            </div>
        </main>
    </div>
</body>
</html>
